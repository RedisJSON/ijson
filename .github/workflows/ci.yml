name: CI

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Build and Test
        uses: ./.github/actions/build_and_test

      # `cargo build` and `cargo test` skip bench targets: build them in both configurations so an
      # API change that breaks a benchmark fails CI.
      - name: Build benchmarks
        run: cargo bench --no-default-features --no-run

      - name: Build benchmarks (thread_safe)
        run: cargo bench --features thread_safe --no-run
  
  memory_gate:
    name: Memory gate (vs tip of the base branch)
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate merges this PR into the base branch's current tip.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Measures the base branch's tip, fetched when the job runs, against that tip with this PR
      # merged in, using one harness; fails if any retained or peak byte count grows at all in the
      # default build (exact counts), or by more than 5 % in thread_safe (median of 5 runs). Changes that reached the base branch are on both sides, so only this PR's count.
      # Re-running the job re-checks against the current tip.
      - name: Memory gate
        run: .github/scripts/memory-gate.sh "${{ github.base_ref }}"

  fuzz_tests:
    name: Fuzz Tests (${{ matrix.fuzz_target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fuzz_target:
          - fuzz_json_de
          - fuzz_cbor_decode
          - fuzz_cbor_roundtrip
          - fuzz_cbor_stream_decode
          - fuzz_object_ops
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Fuzz Tests
        uses: ./.github/actions/fuzz_tests
        with:
          fuzz_target: ${{ matrix.fuzz_target }}

