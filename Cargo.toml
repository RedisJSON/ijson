[workspace]
members = ["fuzz"]

[package]
name = "ijson"
version = "0.1.3"
authors = ["Diggory Blake <diggsey@googlemail.com>"]
edition = "2021"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RedisJSON/ijson"
description = "A more memory efficient replacement for serde_json::Value"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
tracing = ["mockalloc/tracing"]
thread_safe = []

[workspace.dependencies]
serde = "1.0.117"
serde_json = "1.0.59"


[dependencies]
indexmap = "~2.13"
smallvec = "1"
hashbrown = "0.13.2"
dashmap = { version = "5.4", features = ["raw-api"] }
lazy_static = "1.4.0"
serde = { workspace = true }
serde_json = { workspace = true }
ctor = { version = "0.1.16", optional = true }
paste = "1.0.15"
ciborium = { git = "https://github.com/RedisJSON/ciborium", branch = "main" }
ciborium-ll = { git = "https://github.com/RedisJSON/ciborium", branch = "main" }
bytemuck = "1"
half = { version = "2.0.0", features = ["bytemuck"] }
thiserror = "2.0.18"
zstd = "0.13"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
mockalloc = "0.1.2"
ctor = "0.1.16"
rand = "0.8.4"
zstd = "0.13"

# Criterion microbenchmarks of the calls RedisJSON makes into ijson (parse, serialise, lookup,
# mutation, typed arrays, clone/drop, CBOR, defrag); see benches/README.md.
[[bench]]
name = "callpaths"
harness = false

# Deterministic memory referee: retained and peak bytes per fixture and call path (not timed).
[[bench]]
name = "memory"
harness = false

# The same call paths over real files fetched by benches/fetch-datasets.sh (exits 0 without them).
[[bench]]
name = "corpus"
harness = false
